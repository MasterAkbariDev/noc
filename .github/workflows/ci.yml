name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/masterakbaridev/noc

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: noc
          POSTGRES_PASSWORD: noc
          POSTGRES_DB: noc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noc" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/python scripts/check_doc_links.py
      - run: .venv/bin/mypy shared/src sentinel/src noc/src
      - run: .venv/bin/pytest tests -q
        env:
          NOC_TEST_DATABASE_URL: postgresql+psycopg://noc:noc@localhost:5432/noc_test

  demo-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lab/demo-app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  prometheus-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: make rules-test

  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: git ls-files -z '*.sh' | xargs -0 docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable
      - run: make pki-test

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run size
      - run: npm test

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv export --frozen --all-packages --no-dev --no-hashes --no-emit-workspace --format requirements.txt > "$RUNNER_TEMP/requirements.txt"
      - run: uvx pip-audit==2.7.3 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --progress-spinner off
      - run: npm ci && npm audit --audit-level=high
        working-directory: frontend

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: noc
          POSTGRES_PASSWORD: noc
          POSTGRES_DB: noc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noc" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NOC_DATABASE_URL: postgresql+psycopg://noc:noc@localhost:5432/noc_test
      NOC_FRONTEND_DIST: frontend/dist
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create this run's secrets
        run: |
          echo "NOC_E2E_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "NOC_API_TOKEN=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - run: uv sync --frozen
      - run: .venv/bin/noc db upgrade
      - run: .venv/bin/python scripts/seed_panel_demo.py --with-users
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Start the API in the background
        run: |
          nohup .venv/bin/noc api --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/readyz; then
              exit 0
            fi
            sleep 1
          done
          cat api.log
          exit 1
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: |
            frontend/dist/test-results
            frontend/dist/playwright-report
            api.log

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, demo-app, prometheus-rules, shell, frontend, e2e, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/noc/Dockerfile
          build-args: |
            VERSION=main
            GIT_SHA=${{ github.sha }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
