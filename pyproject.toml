[project]
name = "noc-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["noc", "noc-shared", "noc-sentinel"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "sentinel", "noc"]

[tool.uv.sources]
noc = { workspace = true }
noc-shared = { workspace = true }
noc-sentinel = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", ".tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = ["S101", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["noc", "noc_shared", "noc_sentinel", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]
"sentinel/src/noc_sentinel/tools/*.py" = ["S603"]
"sentinel/src/noc_sentinel/config.py" = ["S104"]
"noc/src/noc/policy/engine.py" = ["BLE001"]
"noc/src/noc/db/migrations/env.py" = ["F401"]
"noc/src/noc/db/models.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["shared/src", "sentinel/src", "noc/src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["langgraph.*", "prometheus_client.*", "aiolimiter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs a PostgreSQL database (NOC_TEST_DATABASE_URL)",
    "live: calls a real LLM provider; never runs in CI",
]
