name: memory-leak
description: Turn on the demo-shop memory leak so it grows about 60 MiB a minute towards its 600M MemoryMax; the NOC should see the service's memory near its limit, name a memory leak and restart demo-shop.
injection:
  type: app_fault
  resource_id: svc:demo-shop
  fault: memory_leak
  ttl_seconds: 900
detection_timeout_seconds: 720
outcome_timeout_seconds: 600
ground_truth:
  root_cause_code: memory_leak
  resource_id: svc:demo-shop
  acceptable_actions:
    - restart_service
  expected_outcome: resolved
