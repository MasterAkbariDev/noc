target: lab-demo-1
environment: lab
listen:
  host: 0.0.0.0
  port: 9443
tls:
  cert_file: /etc/noc-sentinel/tls/server.pem
  key_file: /etc/noc-sentinel/tls/server-key.pem
  client_ca_file: /etc/noc-sentinel/tls/ca.pem
key_files:
  noc-worker-2026a: /etc/noc-sentinel/keys/noc-worker-2026a.key
chaos:
  enabled: true
  key_id: noc-scenarios-2026a
  key_file: /etc/noc-sentinel/keys/noc-scenarios-2026a.key
  max_ttl_seconds: 900
  disk_fill_dir: /srv/demo-data
  disk_fill_min_free_bytes: 52428800
  app_chaos_ports:
    svc:demo-shop: 8099
disk_breakdown_roots:
  - /var/log
  - /var/lib/docker
  - /var/cache
  - /var/tmp
  - /tmp
  - /srv/demo-data
state_dir: /var/lib/noc-sentinel
halt_file: /etc/noc-sentinel/HALT
resources:
  - id: svc:demo-shop
    kind: systemd_unit
    name: demo-shop.service
    allowed_actions: [restart_service, start_service, chaos_service_down]
