providers:
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    api_keys_env: GEMINI_API_KEYS
    proxy_env: NOC_GEMINI_PROXY
    quota_timezone: America/Los_Angeles
    models:
      small: { model: gemini-flash-lite-latest, rpm: 12, rpd: 800 }
      strong: { model: gemini-flash-latest, rpm: 8, rpd: 200 }
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    api_keys_env: GROQ_API_KEYS
    proxy_env: NOC_GROQ_PROXY
    quota_timezone: UTC
    models:
      small: { model: openai/gpt-oss-20b, rpm: 25, rpd: 900 }
      strong: { model: openai/gpt-oss-120b, rpm: 25, rpd: 900 }

chains:
  small: [groq, gemini]
  strong: [groq, gemini, "gemini:small"]
