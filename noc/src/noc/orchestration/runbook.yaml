alerts:
  ServiceDown:
    root_cause: service_crashed
    tool: get_service_status
    args: {resource_id: "$resource"}
    category: service
    excerpt_key: active_state
  HostCPUSaturated:
    root_cause: cpu_runaway_process
    tool: get_cpu_usage
    args: {}
    category: resource
    excerpt_key: percent
  HostMemoryPressure:
    root_cause: memory_leak
    tool: get_memory_usage
    args: {}
    category: resource
    excerpt_key: used_bytes
  ResourceMemoryLeakSuspected:
    root_cause: memory_leak
    tool: get_memory_usage
    args: {}
    category: resource
    excerpt_key: used_bytes
  OOMKillsDetected:
    root_cause: oom_kill_loop
    tool: get_memory_usage
    args: {}
    category: resource
    excerpt_key: used_bytes
  DiskAlmostFull:
    root_cause: disk_full_logs
    tool: get_disk_usage
    args: {}
    category: resource
  DiskFillingFast:
    root_cause: disk_full_logs
    tool: get_disk_usage
    args: {}
    category: resource
